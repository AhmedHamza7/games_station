
<app-navbar></app-navbar>

<div class="content-container mt-24 px-8">
  @if (currentLayout === 'SIDEBAR') {
    <div class="flex items-start gap-5">
      <app-sidebar class="w-1/5 sticky top-24"></app-sidebar>
      <div class="w-4/5">
        <router-outlet />
      </div>
      <div class="btn-top fixed bottom-10 right-10 transition-all duration-300 ease-in-out z-50" [ngClass]="{'opacity-100': showBtnTop, 'opacity-0': !showBtnTop}">
        <i class="fa-solid fa-circle-up text-5xl text-white hover:text-gray-300 transition-all duration-300 ease-in-out hover:scale-110 cursor-pointer" (click)="scrollToTop()"></i>
      </div>
    </div>
  } @else {
    <router-outlet />
  }
</div>
